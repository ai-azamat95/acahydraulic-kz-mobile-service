    <!-- Contact-intent tracker. Phone and WhatsApp intent respect the selected
         analytics category; Ads conversions require marketing consent. -->
    <script>
      document.addEventListener('click', function(event) {
        if (window.__ACA_ANALYTICS_EXCLUDE__ || !window.__ACA_COOKIE_CONSENT__) return;
        var link = event.target.closest && event.target.closest('a[href]');
        if (!link) return;
        var href = link.getAttribute('href') || '';
        var kind = href.startsWith('tel:') ? 'phone' : /^https:\/\/wa\.me\//.test(href) ? 'whatsapp' : null;
        if (!kind || typeof window.gtag !== 'function') return;
        try {
          // Do not send WhatsApp query text (client details) to analytics.
          if (window.__ACA_COOKIE_CONSENT__.analytics) {
            // Catalogue links use the existing catalogue action exclusively.
            // A single click must not also emit the generic WhatsApp action.
            var catalogueContact = kind === 'whatsapp' && link.getAttribute('data-aca-contact-event') === 'catalog_whatsapp_click';
            var contactParams = {event_category: kind, transport_type: 'beacon'};
            if (catalogueContact) {
              contactParams.item_id = link.getAttribute('data-aca-item-id') || undefined;
              contactParams.item_category = link.getAttribute('data-aca-item-category') || undefined;
              contactParams.catalog_source = link.getAttribute('data-aca-contact-source') || 'product_page';
            }
            window.gtag('event', catalogueContact ? 'catalog_whatsapp_click' : 'acahydraulic_' + kind + '_click', contactParams);
          }
          if (kind === 'phone' && window.__ACA_COOKIE_CONSENT__.marketing) {
            window.gtag('event', 'conversion', {send_to: 'AW-17847190636/MNy9COmB06QcEOyImr5C'});
          }
        } catch (_) {}
      }, true);
