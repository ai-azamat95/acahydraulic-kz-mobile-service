name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify committed ACA catalogue snapshot
        run: pnpm catalog:verify-public
      - name: Prepare and verify ACA-owned catalogue inputs
        run: |
          node scripts/prepare-public-catalog.mjs
          node scripts/check-owner-catalog-inputs.mjs client/public/catalog-data
      - name: Build
        run: pnpm build
      - name: Create static route copies
        run: node scripts/create-spa-route-copies.mjs
      - name: Create approved pump feed
        run: node scripts/create-merchant-feed.mjs
      - name: Verify owner catalogue products
        run: node --test tests/catalog-owner-products.test.mjs
      - name: Create Industrial AI route copy
        run: node scripts/create-industrial-ai-route.mjs
      - name: Create static case route copies
        run: |
          node scripts/create-case-route-copies.mjs
          node --test tests/diagnostic-terms.test.mjs
          node --test tests/pump-case-publication.test.mjs
          node --test tests/shantui-engine-publication.test.mjs
          node --test tests/shantui-engine-product.test.mjs
          node --test tests/cummins-engine-catalog.test.mjs

      - name: Publish video pages and legacy redirects
        run: |
          node scripts/create-video-seo-routes.mjs
          node --test tests/video-seo.test.mjs
      - name: Create static catalog route copies
        run: |
          pnpm catalog:routes
          pnpm catalog:landing-routes
          node scripts/check-owner-catalog-inputs.mjs dist/public/catalog-data --routes
          node scripts/check-cat-432e-sale.mjs
          node --test tests/merchant-publication.test.mjs
          node --test tests/handok-product-publication.test.mjs
          node --test tests/xcmg-xz200-pump-publication.test.mjs
      - name: Verify catalog SEO and sitemaps
        run: |
          pnpm catalog:verify-seo
          pnpm catalog:verify-landings
      - name: Verify published site has no supplier identity
        run: pnpm catalog:verify-site
      - name: Audit every sitemap page and internal link
        run: python3 scripts/audit-seo.py dist/public --strict > dist/seo-audit.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
