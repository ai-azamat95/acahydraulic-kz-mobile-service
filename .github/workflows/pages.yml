name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync catalog with Sinocmp
        run: pnpm catalog:sync
      - name: Verify complete catalog import
        run: pnpm catalog:verify
      - name: Verify hydraulic pump import
        run: pnpm catalog:verify-pumps
      - name: Remove private supplier data from the public catalogue
        run: pnpm catalog:prepare-public
      - name: Verify public catalogue privacy
        run: pnpm catalog:verify-public
      - name: Build
        run: pnpm build
      - name: Create static route copies
        run: node scripts/create-spa-route-copies.mjs
      - name: Create Industrial AI route copy
        run: node scripts/create-industrial-ai-route.mjs
      - name: Create static case route copies
        run: |
          node scripts/create-case-route-copies.mjs
          node --test tests/pump-case-publication.test.mjs
      - name: Create static catalog route copies
        run: |
          pnpm catalog:routes
          pnpm catalog:landing-routes
      - name: Verify catalog SEO and sitemaps
        run: |
          pnpm catalog:verify-seo
          pnpm catalog:verify-landings
      - name: Verify published site has no supplier identity
        run: pnpm catalog:verify-site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
