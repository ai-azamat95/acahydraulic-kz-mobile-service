name: ACA catalog snapshot check

on:
  pull_request:
    paths:
      - "scripts/import-sinocmp-catalog.mjs"
      - "scripts/fetch-public-catalog-snapshot.mjs"
      - "scripts/mirror-catalog-images.mjs"
      - "scripts/check-public-catalog.mjs"
      - "scripts/lib/catalog-fitment.mjs"
      - "scripts/check-catalog-import.mjs"
      - "scripts/check-catalog-seo.mjs"
      - "scripts/check-catalog-landings.mjs"
      - "scripts/create-catalog-route-copies.mjs"
      - "scripts/create-catalog-landing-routes.mjs"
      - "scripts/lib/catalog-landings.mjs"
      - "shared/catalog-landings.json"
      - "shared/catalog-product-*"
      - "shared/cat-432e-sale.json"
      - "scripts/catalog-owner-sales.mjs"
      - "scripts/prepare-public-catalog.mjs"
      - "tests/cat-432e-sale.test.mjs"
      - "shared/catalog-home-seo.json"
      - "tests/catalog-product-seo.test.mjs"
      - "scripts/create-spa-route-copies.mjs"
      - "scripts/check-pump-import.mjs"
      - "package.json"
      - ".github/workflows/catalog-import-check.yml"
      - ".github/workflows/catalog-refresh.yml"
      - "client/public/catalog-data/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify committed ACA catalogue snapshot
        run: pnpm catalog:verify-public
      - name: Test product-scoped image mirroring
        run: node --test tests/catalog-image-mirror.test.mjs
      - name: Verify reviewed product names and selection copy
        run: node --test tests/catalog-product-seo.test.mjs
      - name: Build fitment-aware product pages
        run: |
          pnpm build
          node scripts/create-spa-route-copies.mjs
          pnpm catalog:routes
          pnpm catalog:landing-routes
      - name: Verify product and landing-page SEO
        run: |
          pnpm catalog:verify-seo
          pnpm catalog:verify-landings
