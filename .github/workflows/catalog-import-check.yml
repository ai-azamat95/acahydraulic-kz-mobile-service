name: ACA catalog snapshot check

on:
  pull_request:
    paths:
      - "scripts/import-sinocmp-catalog.mjs"
      - "scripts/fetch-public-catalog-snapshot.mjs"
      - "scripts/mirror-catalog-images.mjs"
      - "scripts/rebuild-catalog-image-manifest.mjs"
      - "scripts/check-catalog-image-availability.mjs"
      - "scripts/check-catalog-image-audit.mjs"
      - "scripts/recover-missing-catalog-images.mjs"
      - "scripts/audit-catalog-image-text.swift"
      - "scripts/clean-catalog-supplier-marks.py"
      - "scripts/image-audit-requirements.txt"
      - "scripts/check-public-catalog.mjs"
      - "scripts/lib/catalog-fitment.mjs"
      - "scripts/check-catalog-import.mjs"
      - "scripts/check-catalog-seo.mjs"
      - "scripts/check-catalog-landings.mjs"
      - "scripts/create-catalog-route-copies.mjs"
      - "scripts/create-catalog-landing-routes.mjs"
      - "scripts/lib/catalog-landings.mjs"
      - "shared/catalog-landings.json"
      - "shared/catalog-directory.*"
      - "tests/catalog-directory.test.mjs"
      - "shared/catalog-product-*"
      - "shared/catalog-owner-products.json"
      - ".github/workflows/pages.yml"
      - "scripts/check-owner-catalog-inputs.mjs"
      - "tests/owner-catalog-deployment.test.mjs"
      - "scripts/catalog-owner-products.mjs"
      - "tests/catalog-owner-products.test.mjs"
      - "tests/husco-owner-product.test.mjs"
      - "client/public/catalog-assets/husco-6600-f163-a00/**"
      - "shared/cat-432e-sale.json"
      - "scripts/catalog-owner-sales.mjs"
      - "scripts/prepare-public-catalog.mjs"
      - "tests/cat-432e-sale.test.mjs"
      - "shared/catalog-home-seo.json"
      - "tests/catalog-product-seo.test.mjs"
      - "scripts/create-spa-route-copies.mjs"
      - "scripts/check-pump-import.mjs"
      - "package.json"
      - ".github/workflows/catalog-import-check.yml"
      - ".github/workflows/catalog-refresh.yml"
      - ".github/workflows/catalog-integrity.yml"
      - "tests/catalog-image-manifest-rebuild.test.mjs"
      - "CATALOG_INDEPENDENCE.md"
      - "catalog-image-text-audit.json"
      - "client/public/catalog-data/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify committed ACA catalogue snapshot
        run: pnpm catalog:verify-public
      - name: Test product-scoped image mirroring
        run: node --test tests/catalog-image-mirror.test.mjs tests/catalog-image-manifest-rebuild.test.mjs
      - name: Verify current pixel audit
        run: node scripts/check-catalog-image-audit.mjs
      - name: Verify ACA-owned catalogue products and HUSCO evidence
        run: |
          node --test tests/catalog-owner-products.test.mjs tests/husco-owner-product.test.mjs tests/owner-catalog-deployment.test.mjs
          node scripts/prepare-public-catalog.mjs
          node scripts/check-owner-catalog-inputs.mjs client/public/catalog-data
      - name: Verify reviewed product names and selection copy
        run: node --test tests/catalog-product-seo.test.mjs
      - name: Type-check the site
        run: pnpm check
      - name: Build fitment-aware product pages
        run: |
          pnpm build
          node scripts/create-spa-route-copies.mjs
          pnpm catalog:routes
          pnpm catalog:landing-routes
          node scripts/check-owner-catalog-inputs.mjs dist/public/catalog-data --routes
      - name: Verify product and landing-page SEO
        run: |
          pnpm catalog:verify-seo
          pnpm catalog:verify-landings
          node --test tests/catalog-directory.test.mjs
