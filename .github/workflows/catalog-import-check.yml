name: Verify complete SinoCMP catalog import

on:
  pull_request:
    paths:
      - 'scripts/import-sinocmp-catalog.mjs'
      - 'scripts/check-catalog-import.mjs'
      - 'scripts/check-pump-import.mjs'
      - 'package.json'
      - '.github/workflows/catalog-import-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import current SinoCMP catalog
        run: pnpm catalog:sync
      - name: Compare all products, prices, SKUs, titles and galleries
        run: pnpm catalog:verify
      - name: Compare pumps, SKUs, titles and galleries
        run: pnpm catalog:verify-pumps
      - name: Remove private supplier data from the public catalogue
        run: pnpm catalog:prepare-public
      - name: Verify public catalogue privacy
        run: pnpm catalog:verify-public
