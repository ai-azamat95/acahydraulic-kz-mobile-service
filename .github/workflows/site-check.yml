name: Validate site fixes
on:
  push:
    branches: [fix/site-audit]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run client/src/lib/contactIntent.test.ts server/analyticsGate.test.ts
      - run: pnpm exec vitest run client/src/lib/catalogLinks.test.ts client/src/lib/caseConversion.test.ts --pool=threads --poolOptions.threads.singleThread
      - run: pnpm check
      - run: pnpm test
      - run: pnpm checkout:build
      - run: pnpm build
      - run: node scripts/create-spa-route-copies.mjs
      - run: node scripts/create-case-route-copies.mjs
      - run: node scripts/create-video-seo-routes.mjs
      - run: node scripts/create-merchant-feed.mjs
      - run: pnpm catalog:routes
      - run: node scripts/create-catalog-landing-routes.mjs
      - run: node scripts/apply-markdown-alternates.mjs
      - run: node --test tests/*.test.mjs
