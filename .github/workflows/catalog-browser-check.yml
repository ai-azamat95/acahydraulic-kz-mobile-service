name: Check catalogue responsive layout
on:
  pull_request:
    paths:
      - 'client/src/components/MobileSiteMenu.tsx'
      - 'client/src/components/SiteHomeLink.tsx'
      - 'client/src/components/ui/sheet.tsx'
      - 'client/src/pages/Home.tsx'
      - 'client/src/pages/Services.tsx'
      - 'client/src/pages/Reviews.tsx'
      - 'client/src/pages/Contacts.tsx'
      - 'scripts/check-site-navigation.mjs'
      - 'client/src/pages/GnbPartsCatalog.tsx'
      - 'client/src/App.tsx'
      - 'shared/gnb-parts.json'
      - 'scripts/lib/gnb-parts-page.mjs'
      - 'scripts/create-catalog-landing-routes.mjs'
      - 'client/src/pages/Catalog.tsx'
      - 'client/src/pages/CatalogProduct.tsx'
      - 'client/src/components/catalog/ProductResults.tsx'
      - 'client/src/components/catalog/PumpSupplyOffers.tsx'
      - 'client/src/components/CaseCatalogLinks.tsx'
      - 'client/src/pages/cases/PumpSupplyInstallation.tsx'
      - 'client/src/content/pumpCases.ts'
      - 'client/src/lib/catalogLinks.ts'
      - 'client/src/lib/catalogSearch.ts'
      - 'client/src/content/partsCatalog.ts'
      - 'client/src/lib/catalogLandings.ts'
      - 'client/src/hooks/useCatalogProducts.ts'
      - 'shared/catalog-owner-products.json'
      - 'scripts/prepare-public-catalog.mjs'
      - 'scripts/check-owner-catalog-inputs.mjs'
      - '.github/workflows/pages.yml'
      - 'shared/catalog-landings.json'
      - 'client/src/types/catalog.ts'
      - 'client/src/catalog-*.css'
      - 'client/src/index.css'
      - 'scripts/check-gnb-parts-browser.mjs'
      - 'scripts/check-catalog-browser.mjs'
      - '.github/workflows/catalog-browser-check.yml'
permissions:
  contents: read
jobs:
  catalog-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare production catalogue inputs
        run: |
          node scripts/prepare-public-catalog.mjs
          node scripts/check-owner-catalog-inputs.mjs client/public/catalog-data
      - run: pnpm build
      - name: Generate production catalogue routes
        run: |
          node scripts/create-spa-route-copies.mjs
          pnpm catalog:routes
          pnpm catalog:landing-routes
          node scripts/check-owner-catalog-inputs.mjs dist/public/catalog-data --routes
      - name: Install browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/aca-ui" playwright@1.62.1 --no-audit --no-fund
          node "$RUNNER_TEMP/aca-ui/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - run: node scripts/check-catalog-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-browser-check
          path: catalog-ui-check/
          retention-days: 7
