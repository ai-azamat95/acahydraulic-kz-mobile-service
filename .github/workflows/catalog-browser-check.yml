name: Check catalogue responsive layout
on:
  pull_request:
    paths:
      - 'client/src/components/MobileSiteMenu.tsx'
      - 'client/src/components/SiteHomeLink.tsx'
      - 'client/src/components/ui/sheet.tsx'
      - 'client/src/pages/Home.tsx'
      - 'client/src/pages/Services.tsx'
      - 'client/src/pages/Reviews.tsx'
      - 'client/src/pages/Contacts.tsx'
      - 'scripts/check-site-navigation.mjs'
      - 'client/src/pages/Catalog.tsx'
      - 'client/src/pages/CatalogProduct.tsx'
      - 'client/src/components/catalog/ProductResults.tsx'
      - 'client/src/components/catalog/CatalogDirectory.tsx'
      - 'shared/catalog-directory.*'
      - 'shared/catalog-sections.json'
      - 'shared/catalog-pagination.*'
      - 'client/src/components/catalog/CatalogPagination.tsx'
      - 'client/src/components/engines/PaginatedEngineCatalog.tsx'
      - 'scripts/check-catalog-directory-browser.mjs'
      - 'scripts/check-catalog-pagination-browser.mjs'
      - 'scripts/create-catalog-landing-routes.mjs'
      - 'client/src/components/catalog/PumpSupplyOffers.tsx'
      - 'client/src/components/catalog/PumpOrderSelection.tsx'
      - 'client/src/components/B2BLeadForm.tsx'
      - 'client/src/components/ServicePageTemplate.tsx'
      - 'client/src/components/RegionalPageTemplate.tsx'
      - 'shared/pump-order-selection.*'
      - 'scripts/check-pump-order-browser.mjs'
      - 'client/src/components/CaseCatalogLinks.tsx'
      - 'client/src/pages/cases/PumpSupplyInstallation.tsx'
      - 'client/src/content/pumpCases.ts'
      - 'client/src/lib/catalogLinks.ts'
      - 'client/src/lib/catalogSearch.ts'
      - 'client/src/content/partsCatalog.ts'
      - 'client/src/lib/catalogLandings.ts'
      - 'client/src/hooks/useCatalogProducts.ts'
      - 'shared/catalog-owner-products.json'
      - 'shared/catalog-product-phase2-copy.json'
      - 'shared/catalog-product-phase3-copy.json'
      - 'shared/catalog-product-priority-copy.json'
      - 'scripts/create-catalog-product-phase2.mjs'
      - 'scripts/create-catalog-product-phase3.mjs'
      - 'client/public/catalog-assets/priority-products/**'
      - 'scripts/catalog-first-party-images.mjs'
      - 'scripts/sync-priority-catalog-images.mjs'
      - 'scripts/apply-priority-catalog-images.mjs'
      - 'tests/catalog-first-party-images.test.mjs'
      - 'package.json'
      - 'scripts/prepare-public-catalog.mjs'
      - 'scripts/lib/catalog-category-indexes.mjs'
      - 'scripts/check-owner-catalog-inputs.mjs'
      - '.github/workflows/pages.yml'
      - 'shared/catalog-landings.json'
      - 'client/src/types/catalog.ts'
      - 'client/public/catalog-data/**'
      - 'client/src/catalog-*.css'
      - 'client/src/index.css'
      - 'scripts/check-catalog-browser.mjs'
      - 'tests/catalog-category-indexes.test.mjs'
      - '.github/workflows/catalog-browser-check.yml'
permissions:
  contents: read
jobs:
  catalog-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare production catalogue inputs
        run: |
          node scripts/prepare-public-catalog.mjs
          node scripts/check-owner-catalog-inputs.mjs client/public/catalog-data
      - run: pnpm build
      - name: Generate crawlable catalogue navigation
        run: |
          node scripts/create-spa-route-copies.mjs
          node scripts/create-catalog-landing-routes.mjs
      - name: Install browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/aca-ui" playwright@1.62.1 --no-audit --no-fund
          node "$RUNNER_TEMP/aca-ui/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - run: node scripts/check-catalog-browser.mjs
      - run: node scripts/check-pump-order-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-browser-check
          path: |
            catalog-ui-check/
            output/playwright/pump-order/
          retention-days: 7
